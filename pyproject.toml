[project]
name = "pipen-cli-require"
dynamic = ["version"]
description = "A pipen cli plugin to check requirements for processes of a pipeline"
authors = [{ name = "pwwang", email = "pwwang@pwwang.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pipen-annotate>=1.0,<2.0",
]

[tool.hatch.version]
path = "pipen_cli_require/version.py"

[project.entry-points."pipen_cli"]
cli-require = "pipen_cli_require:PipenCliRequirePlugin"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.20",
    "pytest-cov>=6",
    "pytest-xdist>=3",
    "pipen-args>=1.2",
    "pipen>1.1",
    "flake8>=7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'

[tool.pytest.ini_options]
addopts = "-vv -n auto --cov-config=.coveragerc --cov=pipen_cli_require --cov-report xml:.coverage.xml --cov-report term-missing"
asyncio_mode = "auto"
filterwarnings = [
    "ignore:.+may lead to deadlocks in the child:DeprecationWarning",
]
console_output_style = "progress"
junit_family = "xunit1"

[tool.uv]
prerelease = "allow"
